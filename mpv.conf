# mpv-vlc-redesign — mpv.conf
# The interface is drawn by scripts/vlcui. Everything below can be changed freely.

# ---- Interface -------------------------------------------------------------
osc=no                        # vlcui replaces the built-in on-screen controller
osd-bar=no                    # vlcui shows its own seek / volume feedback
border=no                     # vlcui draws its own title bar + window buttons (set to yes for your WM's)
title-bar=no                  # (Windows) hide the native title bar as well
input-builtin-dragging=no     # vlcui handles window dragging itself
force-window=yes
idle=yes                      # show the home screen instead of quitting
keep-open=yes
cursor-autohide=1000
title=${?media-title:${media-title}}${!media-title:Media Player}
autofit-larger=90%x90%
snap-window=yes

# ---- Fonts (bundled in ~~/fonts) --------------------------------------------
osd-fonts-dir=~~/fonts
sub-fonts-dir=~~/fonts
# Note: keep osd-border-style at its default. Script overlays inherit the OSD style,
# and background-box would draw a box behind every element of the interface.
osd-font="Inter"
osd-font-size=28
osd-color="#D6D6D6"
osd-outline-size=1.5
osd-outline-color="#101010"
osd-margin-x=24
osd-margin-y=60

# ---- Playback ----------------------------------------------------------------
save-position-on-quit=yes     # remember where you left off (vlcui shows a "Start over" prompt)
hwdec=auto-safe
volume=100
volume-max=130
screenshot-format=png
screenshot-template="%F-%P"

# ---- Subtitles ---------------------------------------------------------------
sub-auto=fuzzy                # load subtitles whose names roughly match the video
sub-file-paths=subs:Subs:subtitles:Subtitles
slang=en,eng
sub-font="Inter"
sub-bold=yes
sub-font-size=44
sub-outline-size=2.5
sub-color="#FFFFFF"
sub-outline-color="#0C0C0C"
sub-shadow-offset=1
