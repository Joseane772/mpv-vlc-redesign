# vlcui options. Most appearance settings (accent color, interface size, toggles)
# are changed from the in-player Settings window (Ctrl+P) and saved in
# ~/.local/state/mpv/vlcui.json — the values here are only defaults.

# Base UI scale (multiplied by the display's HiDPI scale)
scale=1.0
# Extra scale applied in fullscreen
scale_fullscreen=1.0
# Default accent color (hex, e.g. d37918 = VLC orange, 7c43d6 = purple)
accent=d37918
# Seconds without mouse movement before the bars hide while the mouse rests near them
hide_delay=2.5
# Panel widths (before scaling)
side_width=380
library_width=360
# Move the video aside when a side panel is open
shrink_video=yes

# OpenSubtitles (you can also set these in Settings → Subtitle downloads).
# Get a free API key at https://www.opensubtitles.com/consumers
opensubtitles_api_key=
opensubtitles_username=
opensubtitles_password=
