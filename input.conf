# mpv-vlc-redesign — VLC-style keyboard shortcuts
# Format:  KEY  command  # description
# The descriptions appear in Settings → Keyboard shortcuts (F1).
# Mouse buttons and the wheel are handled by the vlcui script.

SPACE         script-binding vlcui/play-pause         # Play / pause
s             script-binding vlcui/stop               # Stop
n             script-binding vlcui/next               # Next item
p             script-binding vlcui/prev               # Previous item
MBTN_FORWARD  script-binding vlcui/next
MBTN_BACK     script-binding vlcui/prev
f             script-binding vlcui/fullscreen         # Fullscreen
F11           script-binding vlcui/fullscreen
ESC           set fullscreen no                       # Exit fullscreen / close panels
m             script-binding vlcui/mute               # Mute

UP            script-binding vlcui/volume-up          # Volume up
DOWN          script-binding vlcui/volume-down        # Volume down
Ctrl+UP       script-binding vlcui/volume-up
Ctrl+DOWN     script-binding vlcui/volume-down
RIGHT         script-binding vlcui/jump-forward       # Jump forward (10 s, see Settings)
LEFT          script-binding vlcui/jump-back          # Jump backward
Shift+RIGHT   script-binding vlcui/jump-forward-short # Jump forward 3 s
Shift+LEFT    script-binding vlcui/jump-back-short    # Jump backward 3 s
Ctrl+RIGHT    script-binding vlcui/jump-forward-long  # Jump forward 1 min
Ctrl+LEFT     script-binding vlcui/jump-back-long     # Jump backward 1 min
Ctrl+t        script-binding vlcui/jump-to-time       # Jump to time
t             script-binding vlcui/show-time          # Show time

]             script-binding vlcui/speed-up           # Faster
[             script-binding vlcui/speed-down         # Slower
=             script-binding vlcui/speed-reset        # Normal speed
e             script-binding vlcui/frame-step         # Next frame
,             script-binding vlcui/frame-back-step    # Previous frame
l             script-binding vlcui/loop               # Repeat: off / queue / file
Shift+l       script-binding vlcui/ab-loop            # A-B repeat
r             script-binding vlcui/shuffle            # Shuffle queue
Shift+r       script-binding vlcui/record             # Record

v             script-binding vlcui/cycle-sub          # Next subtitle track
b             script-binding vlcui/cycle-audio        # Next audio track
g             script-binding vlcui/sub-delay-down     # Subtitle delay −50 ms
h             script-binding vlcui/sub-delay-up       # Subtitle delay +50 ms
j             script-binding vlcui/audio-delay-down   # Audio delay −50 ms
k             script-binding vlcui/audio-delay-up     # Audio delay +50 ms

a             script-binding vlcui/cycle-aspect       # Aspect ratio
z             script-binding vlcui/zoom-in            # Zoom in
Shift+z       script-binding vlcui/zoom-out           # Zoom out
d             script-binding vlcui/deinterlace        # Deinterlace
Shift+s       script-binding vlcui/snapshot           # Take snapshot
i             script-binding vlcui/media-info         # Media info

Ctrl+b        script-binding vlcui/bookmark           # Add bookmark
Ctrl+\        script-binding vlcui/toggle-ui          # Hide / show the interface
Ctrl+l        script-binding vlcui/toggle-queue       # Queue
Ctrl+m        script-binding vlcui/toggle-library     # Library
Ctrl+e        script-binding vlcui/toggle-sidebar     # Playback, video, audio & subtitle settings
Ctrl+p        script-binding vlcui/settings           # Settings
F1            script-binding vlcui/shortcuts          # Keyboard shortcuts
MENU          script-binding vlcui/context-menu       # Context menu
Alt+m         script-binding vlcui/main-menu          # Media menu
Shift+p       script-binding vlcui/mini-player        # Mini player

Ctrl+o        script-binding vlcui/open-file          # Open file
Ctrl+f        script-binding vlcui/open-folder        # Open folder
Ctrl+n        script-binding vlcui/open-url           # Open network stream
Ctrl+v        script-binding vlcui/paste              # Play from clipboard
Ctrl+Shift+v  script-binding vlcui/add-subtitle       # Add subtitle file
Ctrl+q        script-binding vlcui/quit               # Quit
q             quit
Q             quit-watch-later
